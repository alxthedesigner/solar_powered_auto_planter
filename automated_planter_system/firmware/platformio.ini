; Solar rain planter firmware (ESP32 DevKit). Build and upload with PlatformIO:
;   pio run -t upload && pio device monitor
; Copy src/config_example.h to src/planter_config.h and fill it in first.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv   ; 3 MB for the app: the setup page and SD support need room (no OTA)
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0
    adafruit/RTClib@2.1.4
build_flags =
    -DCORE_DEBUG_LEVEL=3
; Find your port with: pio device list   (Mac: /dev/cu.usbserial-*, Linux: /dev/ttyUSB0)
;upload_port = /dev/cu.usbserial-0001
